# Cancelación de eco de PipeWire (WebRTC) para usar Dictado con altavoces.
# Crea un micrófono virtual "echo-cancel-source" que resta lo que suena por
# los altavoces. Instalar en ~/.config/pipewire/pipewire.conf.d/ y reiniciar
# PipeWire: systemctl --user restart pipewire pipewire-pulse wireplumber
# Después, en ~/.config/dictado/config.toml: mic_source = "echo-cancel-source"
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = true
            capture.props = {
                node.name = "echo-cancel-capture"
                node.passive = true
            }
            source.props = {
                node.name = "echo-cancel-source"
                node.description = "Micrófono con cancelación de eco"
            }
            sink.props = {
                node.name = "echo-cancel-sink"
                node.passive = true
            }
        }
    }
]
