# PipeWire echo cancellation (WebRTC) for using Dictado with speakers.
# Creates a virtual microphone "echo-cancel-source" that subtracts whatever
# the speakers play. Copy to ~/.config/pipewire/pipewire.conf.d/ and restart
# PipeWire: systemctl --user restart pipewire pipewire-pulse wireplumber
# Then, in ~/.config/dictado/config.toml: mic_source = "echo-cancel-source"
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = true
            capture.props = {
                node.name = "echo-cancel-capture"
                node.passive = true
            }
            source.props = {
                node.name = "echo-cancel-source"
                node.description = "Microphone with echo cancellation"
            }
            sink.props = {
                node.name = "echo-cancel-sink"
                node.passive = true
            }
        }
    }
]
